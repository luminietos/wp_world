<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="wp_world" />

    <!-- ========================================================= -->
    <!-- THEME-AWARE FAVICONS (USER OS/BROWSER THEME, NOT APP THEME) -->
    <!-- ========================================================= -->

    <!-- DEFAULT/FALL-BACK favicon (light mode 32x32) -->
    <!-- Used when browser does not support prefers-color-scheme -->
    <link
      rel="icon"
      sizes="32x32"
      href="assets\icons\favicon-light.io\favicon-32x32.png"
    />

    <!-- LIGHT MODE favicon -->
    <link
      rel="icon"
      href="assets\icons\favicon-light.io\favicon-32x32.png"
      media="(prefers-color-scheme: light)"
    />

    <!-- DARK MODE favicon -->
    <link
      rel="icon"
      href="assets\icons\favicon-dark.io\favicon-32x32.png"
      media="(prefers-color-scheme: dark)"
    />

    <!-- APPLE touch icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/icons/apple-touch-icon.png"
    />

    <!-- Optional: PWA ICONS -->
    <link
      rel="icon"
      sizes="192x192"
      href="assets\icons\favicon-light.io\android-chrome-192x192.png"
    />
    <link
      rel="icon"
      sizes="512x512"
      href="assets\icons\favicon-light.io\android-chrome-512x512.png"
    />

    <title>wp_world</title>
    <link rel="manifest" href="manifest.json" />
  </head>

  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
